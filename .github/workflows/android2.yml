name: Build Bara Salfa yemeny APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q BarasalfaIcon.zip
          ls -la
          test -f BaraSalfaAndroid/app/build.gradle || test -f BarasalfaIcon/app/build.gradle || test -f app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          
      - name: Set app name to Bara Salfa Yemen
        run: |
          MANIFEST=$(find extracted -name AndroidManifest.xml -path '*/src/main/*' | head -n 1)
          if [ -n "$MANIFEST" ]; then
            STRINGS="$(dirname "$MANIFEST")/res/values/strings.xml"
            mkdir -p "$(dirname "$STRINGS")"
            if [ -f "$STRINGS" ]; then
              if grep -q 'name="app_name"' "$STRINGS"; then
                sed -i 's#<string name="app_name">.*</string>#<string name="app_name">برا السالفة اليمنية</string>#' "$STRINGS"
              else
                sed -i 's#</resources>#    <string name="app_name">برا السالفة اليمنية</string>\n</resources>#' "$STRINGS"
              fi
            else
              printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">برا السالفة اليمنية</string>\n</resources>\n' > "$STRINGS"
            fi
          fi

      - name: Build APK
        run: |
          # يحدد اسم المجلد تلقائياً
          if [ -d BaraSalfaAndroid ]; then cd BaraSalfaAndroid; elif [ -d BarasalfaIcon ]; then cd BarasalfaIcon; fi
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaraSalfa-APK
          path: |
            BaraSalfaAndroid/app/build/outputs/apk/debug/app-debug.apk
            BarasalfaIcon/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
